# Contrôles qualité à chaque push sur main et à chaque pull request.
#
# Sécurité de la chaîne logicielle : la politique impose détection de secrets
# (Gitleaks) et SBOM / analyse de vulnérabilités (Grype), avec règles de blocage
# et exceptions validées par le RSSI. Ces étapes ne sont volontairement PAS
# recopiées ici : leur intégration doit être décidée avec le RSSI (template
# `TOOLS/Pipelines security/devsecops.yml` si le dépôt passe sur Azure DevOps).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Vérifier que le schéma et les migrations sont synchronisés
        run: npx drizzle-kit check
      - run: npm run build
